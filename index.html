<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chess vs Shreyas Bot</title>

<style>
* { box-sizing: border-box; }

body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    padding: 15px;
    background: #1a1a1a;
    color: white;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    gap: 12px;
}

h2 { margin: 0; font-weight: 600; letter-spacing: 0.5px; }

#board-container {
    perspective: 1000px;
    padding: 20px;
}

#board {
    display: grid;
    grid-template-columns: repeat(8, min(10.5vw, 66px));
    grid-template-rows: repeat(8, min(10.5vw, 66px));
    border: 4px solid #fff;
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    transition: transform 0.4s ease, box-shadow 0.4s ease;
}

/* --- VIEW MODES --- */
/* 2D Modern */
.mode-2d {
    transform: rotateX(0deg);
}

/* 3D Board Perspective */
.mode-3d {
    transform: rotateX(32deg) rotateZ(0deg);
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8), 0 15px 15px rgba(0, 0, 0, 0.5);
    border-bottom: 12px solid #333 !important;
}

.mode-3d .sq {
    transform-style: preserve-3d;
}

.mode-3d .white-p, .mode-3d .black-p {
    transform: translateZ(10px) rotateX(-15deg);
    text-shadow: 0 8px 10px rgba(0,0,0,0.6);
    display: inline-block;
}

/* Classic Normal */
.mode-classic {
    transform: rotateX(0deg);
    border-color: #8b5a2b !important;
}

.sq {
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
    font-size: clamp(27px, 7vw, 43px);
    cursor: pointer;
    user-select: none;
}

/* Themes */
.theme-wood .light { background: #f0d9b5; }
.theme-wood .dark { background: #b58863; }

.theme-green .light { background: #eeeed2; }
.theme-green .dark { background: #769656; }

.theme-blue .light { background: #dee3e6; }
.theme-blue .dark { background: #4b7399; }

.theme-gray .light { background: #e0e0e0; }
.theme-gray .dark { background: #666666; }

.white-p {
    color: white;
    text-shadow: 0 0 3px black;
}

.black-p {
    color: black;
    text-shadow: 0 0 2px white;
}

.selected { box-shadow: inset 0 0 0 4px #829769; }

.last-move {
    background-image: linear-gradient(#baca4488, #baca4488);
}

.dot {
    position: absolute;
    width: 17%;
    height: 17%;
    border-radius: 50%;
    background: #526b4b99;
    pointer-events: none;
}

.capture-dot {
    position: absolute;
    inset: 4px;
    border: 4px solid #526b4b99;
    border-radius: 50%;
    pointer-events: none;
}

#status {
    min-height: 24px;
    text-align: center;
    font-weight: bold;
}

#controls {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 10px;
}

button, select {
    padding: 9px 12px;
    border: 0;
    border-radius: 6px
