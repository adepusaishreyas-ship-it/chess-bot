<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chess vs Shreyas Bot</title>

<!-- Chess.js library CDN -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

<style>
* { box-sizing: border-box; }

body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    padding: 15px;
    background: #111;
    color: white;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    gap: 12px;
}

h2 { margin: 0; font-weight: 600; letter-spacing: 0.5px; color: #eee; }

#board-container {
    perspective: 1200px;
    padding: 15px;
}

#board {
    display: grid;
    grid-template-columns: repeat(8, min(10.5vw, 68px));
    grid-template-rows: repeat(8, min(10.5vw, 68px));
    border: 5px solid #fff;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
    transition: transform 0.4s ease, box-shadow 0.4s ease, border-color 0.4s ease;
    transform-style: preserve-3d;
}

/* --- VIEW MODES --- */
.mode-2d {
    transform: rotateX(0deg);
}

.mode-3d {
    transform: rotateX(30deg) rotateZ(0deg);
    box-shadow: 0 25px 50px rgba(0, 0, 0, 0.9), 0 15px 15px rgba(0, 0, 0, 0.6);
    border-bottom: 15px solid #444 !important;
}

.mode-3d .piece-svg {
    transform: rotateX(-30deg) translateZ(5px);
    transform-origin: bottom center;
}

.mode-classic {
    transform: rotateX(0deg);
    border-color: #8b5a2b !important;
}

.sq {
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
    cursor: pointer;
    user-select: none;
}

/* Themes */
.theme-wood .light { background: #f0d9b5; }
.theme-wood .dark { background: #b58863; }

.theme-green .light { background: #eeeed2; }
.theme-green .dark { background: #769656; }

.theme-blue .light { background: #dee3e6; }
.theme-blue .dark { background: #4b7399; }

.theme-gray .light { background: #e0e0e0; }
.theme-gray .dark { background: #666666; }

/* SVG Piece Styling */
.piece-svg {
    width: 88%;
    height: 88%;
    pointer-events: none;
    filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.4));
}

.selected { background-color: rgba(255, 255, 100, 0.5) !important; }

.last-move {
    background-color: rgba(155, 199, 0, 0.5) !important;
}

.dot {
    position: absolute;
    width: 25%;
    height: 25%;
    border-radius: 50%;
    background: rgba(0, 0, 0, 0.3);
    pointer-events: none;
}

.capture-dot {
    position: absolute;
    inset: 10%;
    border: 5px solid rgba(0, 0, 0, 0.2);
    border-radius: 50%;
    pointer-events: none;
}

#status {
    min-height: 24px;
    text-align: center;
    font-weight: bold;
    color: #ccc;
}

#controls {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 10px;
    background: #222;
    border-radius: 8px;
}

button, select {
    padding: 9px 12px;
    border: 0;
    border-radius: 6px;
    font-weight: bold;
    cursor: pointer;
    background: #444;
    color: white;
    font-size: 14px;
    transition: background 0.2s ease;
}

button:hover, select:hover { background: #555; }

#newGame { background: #e67e22; color: white; }
#newGame:hover { background: #d35400; }

#hint {
    max-width: 520px;
    color: #aaa;
    text-align: center;
    font-size: 13px;
    line-height: 1.5;
}

kbd {
    background: #333;
    padding: 2px 6px;
    border-radius: 4px;
    border: 1px solid #555;
    font-family: monospace;
    color: #eee;
}
</style>
</head>

<body>

<h2>Chess vs Shreyas Bot</h2>

<div id="board-container">
    <div id="board" class="theme-wood mode-3d"></div>
</div>

<div id="status">Loading chess engine...</div>

<div id="controls">
    <button id="newGame">New Game</button>
    
    <label for="boardMode">View:</label>
    <select id="boardMode">
        <option value="mode-2d">2D Modern</option>
        <option value="mode-3d" selected>3D Board</option>
        <option value="mode-classic">Classic Normal</option>
    </select>

    <label for="userColor">Play as:</label>
    <select id="userColor">
        <option value="w" selected>White</option>
        <option value="b">Black</option>
    </select>

    <label for="boardTheme">Theme:</label>
    <select id="boardTheme">
        <option value="theme-wood" selected>Wood</option>
        <option value="theme-green">Green</option>
        <option value="theme-blue">Blue</option>
        <option value="theme-gray">Gray</option>
    </select>

    <label for="elo">Bot Strength:</label>
    <select id="elo">
        <option value="1600">1600</option>
        <option value="1800">1800</option>
        <option value="2000" selected>2000</option>
        <option value="2200">2200</option>
        <option value="max">Maximum</option>
    </select>
</div>

<div id="hint">
    Press <kbd>←</kbd> (Left Arrow) to undo move | Press <kbd>X</kbd> to flip board<br>
    Embedded high-res vector piece set | Powered by Sai Shreyas Adepu
</div>

<script>
// Embedded SVG Vector Data for guaranteed rendering without broken external images

    wB: `<svg class="piece-svg" viewBox="0 0 45 45"><g fill="#fff" stroke="#000" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 36h27v3H9zM12 33h21v3H12z"/><path d="M15 30c.8 0 2.2-1.8 2.2-4.5 0-3.2-2.2-5.5-2.2-8.5 0-3.5 3.3-6.5 7.5-6.5s7.5 3 7.5 6.5c0 3-2.2 5.3-2.2 8.5 0 2.7 1.4 4.5 2.2 4.5H15z"/><circle cx="22.5" cy="8.5" r="2.5"/><path d="M20 15h5m-2.5-2.5v5"/></g></svg>`,
    wQ: `<svg class="piece-svg" viewBox="0 0 45 45"><g fill="#fff" stroke="#000" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 12a2 2 0 1 1 4 0 2 2 0 1 1-4 0zM15.5 9.5a2 2 0 1 1 4 0 2 2 0 1 1-4 0zM20.5 8a2 2 0 1 1 4 0 2 2 0 1 1-4 0zM25.5 9.5a2 2 0 1 1 4 0 2 2 0 1 1-4 0zM33 12a2 2 0 1 1 4 0 2 2 0 1 1-4 0z"/><path d="M9 26c0 2 1.5 2 2.5 4 1 1.5 1 1.5 2.5 2h17c1.5-.5 1.5-.5 2.5-2 1-2 2.5-2 2.5-4 0-4-3-8-3-8l-5.5 8.5-4.5-12.5-4.5 12.5L12 18s-3 4-3 8z"/><path d="M11 38h23v-3H11v3z"/></g></svg>`,
    wK: `<svg class="piece-svg" viewBox="0 0 45 45"><g fill="#fff" stroke="#000" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22.5 11.63V6M20 9h5M22.5 25c-4 0-7-2.5-7-7 0-3 2.5-6 7-6s7 3 7 6c0 4.5-3 7-7 7z"/><path d="M11.5 37h22v-3h-22v3zM12 33.5h21l-1-3.5h-19l-1 3.5zM15 28h15c1.5 0 2.5-1 2.5-2.5s-1-2.5-2.5-2.5h-15c-1.5 0-2.5 1-2.5 2.5s1 2.5 2.5 2.5z"/></g></svg>`,
    
    bP: `<svg class="piece-svg" viewBox="0 0 45 45"><path d="M22.5 9c-2.21 0-4 1.79-4 4 0 .89.29 1.71.78 2.38C17.33 16.5 16 18.59 16 21c0 2.03.94 3.84 2.41 5.03-3 1.06-7.41 5.55-7.41 13.47h23c0-7.92-4.41-12.41-7.41-13.47 1.47-1.19 2.41-3 2.41-5.03 0-2.41-1.33-4.5-3.28-5.62.49-.67.78-1.49.78-2.38 0-2.21-1.79-4-4-4z" fill="#000" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/></svg>`,
    bR: `<svg class="piece-svg" viewBox="0 0 45 45"><g fill="#000" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 39h27v-3H9v3zM12 36h21l-1.5-4h-18l-1.5 4zM11 14h23l-2 18H13l-2-18zM9 10h4v4H9v-4zM15 10h4v4h-4v-4zM21 10h3v4h-3v-4zM26 10h4v4h-4v-4zM32 10h4v4h-4v-4z"/><path d="M11 14h23v2H11v-2z" fill="#fff"/></g></svg>`,
    bN: `<svg class="piece-svg" viewBox="0 0 45 45"><g fill="#000" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10c1.05 0 8.02.02 9.36 8.68 1.02 6.58-1.63 9.42-1.63 9.42s2.83 2.31 1.84 6.81c-.81 3.68-3.07 4.09-3.07 4.09H11.5s-1.89-2.52-1.89-7.29c0-6.72 6.57-11.2 9.68-12.71C18.23 18 17.5 14 22 10z"/><path d="M14 25.5c-1.5.5-3 .5-4.5-.5m13.5-3c-1.5.5-3 .5-4.5-.5" fill="none" stroke="#fff"/></g></svg>`,
    bB: `<svg class="piece-svg" viewBox="0 0 45 45"><g fill="#000" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 36h27v3H9zM12 33h21v3H12z"/><path d="M15 30c.8 0 2.2-1.8 2.2-4.5 0-3.2-2.2-5.5-2.2-8.5 0-3.5 3.3-6.5 7.5-6.5s7.5 3 7.5 6.5c0 3-2.2 5.3-2.2 8.5 0 2.7 1.4 4.5 2.2 4.5H15z"/><circle cx="22.5" cy="8.5" r="2.5"/><path d="M20 15h5m-2.5-2.5v5" stroke="#fff"/></g></svg>`,
    bQ: `<svg class="piece-svg" viewBox="0 0 45 45"><g fill="#000" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 12a2 2 0 1 1 4 0 2 2 0 1 1-4 0zM15.5 9.5a2 2 0 1 1 4 0 2 2 0 1 1-4 0zM20.5 8a2 2 0 1 1 4 0 2 2 0 1 1-4 0zM25.5 9.5a2 2 0 1 1 4 0 2 2 0 1 1-4 0zM33 12a2 2 0 1 1 4 0 2 2 0 1 1-4 0z"/><path d="M9 26c0 2 1.5 2 2.5 4 1 1.5 1 1.5 2.5 2h17c1.5-.5 1.5-.5 2.5-2 1-2 2.5-2 2.5-4 0-4-3-8-3-8l-5.5 8.5-4.5-12.5-4.5 12.5L12 18s-3 4-3 8z"/><path d="M11 38h23v-3H11v3z"/></g></svg>`,
    bK: `<svg class="piece-svg" viewBox="0 0 45 45"><g fill="#000" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22.5 11.63V6M20 9h5M22.5 25c-4 0-7-2.5-7-7 0-3 2.5-6 7-6s7 3 7 6c0 4.5-3 7-7 7z"/><path d="M11.5 37h22v-3h-22v3zM12 33.5h21l-1-3.5h-19l-1 3.5zM15 28h15c1.5 0 2.5-1 2.5-2.5s-1-2.5-2.5-2.5h-15c-1.5 0-2.5 1-2.5 2.5s1 2.5 2.5 2.5z"/></g></svg>`
};

const game = new Chess();

const boardEl = document.getElementById("board");
const statusEl = document.getElementById("status");
const eloEl = document.getElementById("elo");
const userColorEl = document.getElementById("userColor");
const boardThemeEl = document.getElementById("boardTheme");
const boardModeEl = document.getElementById("boardMode");

let userColor = "w";
let boardFlipped = false;
let selected = null;
let validMoves = [];
let thinking = false;
let engineReady = false;
let lastMove = null;
let searchId = 0;

let engine;
function initEngine() {
    try {
        const workerCode = `importScripts('https://cdnjs.cloudflare.com/ajax/libs/stockfish.js/10.0.2/stockfish.js');`;
        const blob = new Blob([workerCode], { type: 'application/javascript' });
        engine = new Worker(URL.createObjectURL(blob));

        engine.onmessage = function(event) {
            const line = String(event.data || "").trim();

            if (line === "uciok") {
                engine.postMessage("setoption name UCI_LimitStrength value true");
                engine.postMessage("setoption name UCI_Elo value 2000");
                engine.postMessage("isready");
                return;
            }

            if (line === "readyok") {
                engineReady = true;
                updateStatus();
                if (game.turn() !== userColor) {
                    requestBotMove();
                }
                return;
            }

            if (line.startsWith("bestmove ")) {
                const moveText = line.split(/\s+/)[1];

                if (!thinking) return;

                if (!moveText || moveText === "(none)") {
                    thinking = false;
                    updateStatus();
                    return;
                }

                const move = {
                    from: moveText.slice(0, 2),
                    to: moveText.slice(2, 4)
                };

                if (moveText.length >= 5) {
                    move.promotion = moveText[4].toLowerCase();
                }

                try {
                    const played = game.move(move);
                    if (played) {
                        lastMove = { from: played.from, to: played.to };
                    }
                } catch (error) {
                    console.error("Invalid engine move:", error);
                }

                thinking = false;
                selected = null;
                validMoves = [];

                draw();
                updateStatus();
            }
        };

        engine.onerror = function(err) {
            console.error(err);
            statusEl.textContent = "Engine failed to load.";
        };

        engine.postMessage("uci");
    } catch (e) {
        statusEl.textContent = "Engine restriction error.";
    }
}

initEngine();

function draw() {
    boardEl.innerHTML = "";
    const position = game.board();

    for (let r = 0; r < 8; r++) {
        for (let c = 0; c < 8; c++) {
            const row = boardFlipped ? 7 - r : r;
            const col = boardFlipped ? 7 - c : c;
            const name = "abcdefgh"[col] + String(8 - row);
            const piece = position[row][col];

            const square = document.createElement("div");
            square.className = "sq " + ((row + col) % 2 === 0 ? "light" : "dark");

            if (piece) {
                const key = piece.color + piece.type.toUpperCase();
                square.innerHTML = svgPieces[key];
            }

            if (selected === name) {
                square.classList.add("selected");
            }

            if (lastMove && (lastMove.from === name || lastMove.to === name)) {
                square.classList.add("last-move");
            }

            const destination = validMoves.find(move => move.to === name);
            if (destination) {
                const marker = document.createElement("div");
                marker.className = piece ? "capture-dot" : "dot";
                square.appendChild(marker);
            }

            square.addEventListener("click", function() {
                clickSquare(name);
            });

            boardEl.appendChild(square);
        }
    }
}

function clickSquare(square) {
    if (thinking || !engineReady || game.game_over() || game.turn() !== userColor) {
        return;
    }

    const chosenMove = validMoves.find(move => move.to === square);

    if (selected && chosenMove) {
        const movingPiece = game.get(selected);
        const move = { from: selected, to: square };

        const promoRank = userColor === "w" ? "8" : "1";
        if (movingPiece && movingPiece.type === "p" && square[1] === promoRank) {
            move.promotion = "q";
        }

        try {
            const played = game.move(move);
            lastMove = { from: played.from, to: played.to };
        } catch (error) {
            selected = null;
            validMoves = [];
            draw();
            return;
        }

        selected = null;
        validMoves = [];

        draw();
        updateStatus();

        if (!game.game_over()) {
            requestBotMove();
        }

        return;
    }

    const piece = game.get(square);
    if (piece && piece.color === userColor) {
        selected = square;
        validMoves = game.moves({ square: square, verbose: true });
    } else {
        selected = null;
        validMoves = [];
    }

    draw();
}

function requestBotMove() {
    if (!engineReady || game.game_over() || game.turn() === userColor) {
        return;
    }

    thinking = true;
    searchId++;
    statusEl.textContent = "Bot is thinking...";

    const strength = eloEl.value;
    if (strength === "max") {
        engine.postMessage("setoption name UCI_LimitStrength value false");
    } else {
        engine.postMessage("setoption name UCI_LimitStrength value true");
        engine.postMessage("setoption name UCI_Elo value " + strength);
    }

    engine.postMessage("isready");

    const startSearch = function(event) {
        if (String(event.data || "").trim() !== "readyok") return;
        engine.removeEventListener("message", startSearch);

        if (!thinking || game.game_over()) return;
        engine.postMessage("position fen " + game.fen());
        engine.postMessage("go movetime 1500");
    };

    engine.addEventListener("message", startSearch);
}

function undoMove() {
    if (thinking) return;

    const history = game.history({ verbose: true });

    if (game.turn() === userColor && history.length >= 2) {
        game.undo();
        game.undo();
    } else if (history.length === 1) {
        game.undo();
    }

    const updatedHistory = game.history({ verbose: true });
    if (updatedHistory.length > 0) {
        const previous = updatedHistory[updatedHistory.length - 1];
        lastMove = { from: previous.from, to: previous.to };
    } else {
        lastMove = null;
    }

    selected = null;
    validMoves = [];
    draw();
    updateStatus();

    if (game.turn() !== userColor && !game.game_over()) {
        requestBotMove();
    }
}

document.addEventListener("keydown", function(e) {
    if (e.key === "ArrowLeft") {
        undoMove();
    }
    if (e.key === "x" || e.key === "X") {
        boardFlipped = !boardFlipped;
        draw();
    }
});

function updateStatus() {
    if (game.in_checkmate()) {
        statusEl.textContent = game.turn() === userColor ? "Checkmate! The bot wins." : "Checkmate! You win!";
        return;
    }
    if (game.in_stalemate()) { statusEl.textContent = "Draw by stalemate."; return; }
    if (game.in_threefold_repetition()) { statusEl.textContent = "Draw by threefold repetition."; return; }
    if (game.insufficient_material()) { statusEl.textContent = "Draw: insufficient material."; return; }
    if (game.in_draw()) { statusEl.textContent = "The game is a draw."; return; }
    if (thinking) { statusEl.textContent = "Bot is thinking..."; return; }
    if (!engineReady) { statusEl.textContent = "Loading chess engine..."; return; }
    if (game.in_check()) {
        statusEl.textContent = game.turn() === userColor ? "Your king is in check!" : "The bot's king is in check!";
        return;
    }
    statusEl.textContent = game.turn() === userColor ? `Your turn (${userColor === 'w' ? 'White' : 'Black'})` : "Bot's turn";
}

function resetGame() {
    userColor = userColorEl.value;
    boardFlipped = userColor === "b";
    thinking = false;
    searchId++;
    if (engineReady) engine.postMessage("stop");
    game.reset();
    selected = null;
    validMoves = [];
    lastMove = null;
    draw();
    updateStatus();

    if (userColor === "b" && engineReady) {
        requestBotMove();
    }
}

function updateBoardClasses() {
    boardEl.className = `${boardThemeEl.value} ${boardModeEl.value}`;
}

document.getElementById("newGame").addEventListener("click", resetGame);
userColorEl.addEventListener("change", resetGame);
boardThemeEl.addEventListener("change", updateBoardClasses);
boardModeEl.addEventListener("change", updateBoardClasses);

eloEl.addEventListener("change", function() {
    updateStatus();
});

draw();
updateStatus();
</script>

</body>
</html>
